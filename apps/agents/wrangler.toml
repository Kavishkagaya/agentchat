name = "agentchat-agents"
main = "src/index.ts"
compatibility_date = "2025-02-01"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "Sandbox"
class_name = "Sandbox"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Sandbox"]

[[containers]]
class_name = "Sandbox"
image = "./Dockerfile"

[env.production.durable_objects]
bindings = [{name = "Sandbox", class_name = "Sandbox"}]

[[env.production.migrations]]
tag = "v1"
new_sqlite_classes = ["Sandbox"]

[[env.production.containers]]
class_name = "Sandbox"
image = "./Dockerfile"

[vars]
ENVIRONMENT = "dev"
CLOUDFLARE_AIG_TOKEN = ""
CLOUDFLARE_AIG_ACCOUNT_ID = ""
CLOUDFLARE_AIG_GATEWAY_ID = ""
DATABASE_URL = ""
GC_PUBLIC_KEY = ""
SECRETS_ENCRYPTION_KEY = ""
