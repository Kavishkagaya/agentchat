name = "agentchat-chat-controller"
main = "src/index.ts"
compatibility_date = "2025-02-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "dev"
AGENTS_BASE_URL = "http://localhost:8787"
DATABASE_URL = ""
ORCHESTRATOR_PUBLIC_KEY = ""
GC_PRIVATE_KEY = ""

[[durable_objects.bindings]]
name = "MEMORY_CONTROLLER"
class_name = "MemoryController"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MemoryController"]
