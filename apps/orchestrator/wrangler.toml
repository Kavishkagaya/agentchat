name = "agentchat-orchestrator"
main = "src/index.ts"
compatibility_date = "2025-02-01"
compatibility_flags = ["nodejs_compat"]

[triggers]
crons = ["*/5 * * * *", "0 3 * * *"]

[[r2_buckets]]
binding = "TEMPLATES_BUCKET"
bucket_name = "agentchat-templates"

[[r2_buckets]]
binding = "ARCHIVES_BUCKET"
bucket_name = "agentchat-archives"

[vars]
ENVIRONMENT = "dev"
APP_PUBLIC_KEY = ""
ORCHESTRATOR_PRIVATE_KEY = ""
ORCHESTRATOR_PUBLIC_KEY = ""
NEON_DATABASE_URL = ""

[[durable_objects.bindings]]
name = "MEMORY_CONTROLLER"
class_name = "MemoryController"
script_name = "agentchat-chat-controller"
